<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Full Bone Editor</title>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.152.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.152.0/examples/jsm/"
  }
}
</script>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: #111;
    color: white;
    font-family: sans-serif;
}

#ui {
    position: fixed;
    top: 10px;
    left: 10px;
    width: 260px;
    background: rgba(0,0,0,0.85);
    padding: 12px;
    border-radius: 10px;
    font-size: 12px;
}

h3 { margin: 8px 0 5px; color: #00ffcc; }

select, input {
    width: 100%;
    margin-bottom: 6px;
}

button {
    width: 100%;
    padding: 10px;
    background: #00ffcc;
    border: none;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #00ccaa;
}
</style>
</head>

<body>

<div id="ui">
    <h3>Bone Selector</h3>
    <select id="boneSelect"></select>

    <h3>Rotation Control</h3>
    X <input id="bx" type="range" min="-3" max="3" step="0.01" value="0">
    Y <input id="by" type="range" min="-3" max="3" step="0.01" value="0">
    Z <input id="bz" type="range" min="-3" max="3" step="0.01" value="0">

    <button id="copy">Copy Full Pose</button>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 1.5, 3);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.update();

scene.add(new THREE.AmbientLight(0xffffff, 0.7));

const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(3, 5, 2);
scene.add(light);

let bones = {};
let boneList = [];
let activeBone = null;

const boneSelect = document.getElementById("boneSelect");

const loader = new GLTFLoader();
loader.load('./defmale.glb', (gltf) => {
    const model = gltf.scene;
    scene.add(model);

    const uniqueBones = new Set();

    model.traverse((n) => {
        if (n.isBone) {
            uniqueBones.add(n.name);
            bones[n.name] = n;
        }
    });

    boneList = Array.from(uniqueBones);

    boneList.forEach(name => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        boneSelect.appendChild(opt);
    });

    activeBone = bones[boneList[0]];
});

boneSelect.onchange = () => {
    activeBone = bones[boneSelect.value];
};

const bx = document.getElementById("bx");
const by = document.getElementById("by");
const bz = document.getElementById("bz");

function animate() {
    requestAnimationFrame(animate);

    if (activeBone) {
        activeBone.rotation.x = parseFloat(bx.value);
        activeBone.rotation.y = parseFloat(by.value);
        activeBone.rotation.z = parseFloat(bz.value);
    }

    renderer.render(scene, camera);
}
animate();

document.getElementById("copy").onclick = () => {
    let data = {};

    boneList.forEach(name => {
        const b = bones[name];
        data[name] = {
            x: b.rotation.x,
            y: b.rotation.y,
            z: b.rotation.z
        };
    });

    navigator.clipboard.writeText(JSON.stringify(data, null, 2));
    alert("Full pose copied!");
};
</script>
<script type="module">
    
</script>

</body>
</html>
